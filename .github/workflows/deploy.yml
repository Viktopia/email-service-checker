name: Build & deploy

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so the build can read each page's real last-commit
          # date for <lastmod>. A shallow clone would fall back to the build
          # date, which is the signal this replaced.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # `check` is lint + formatting + import order. It ran only `lint` before,
      # so the whole tree had drifted out of format and `bun run check` failed
      # for any contributor out of the box.
      - name: Lint and formatting (Biome)
        run: bun run check

      - name: Type-check
        run: bun run typecheck

      - name: Test
        run: bun test

      # The consumer-domain lists are committed under ./data/, so the build
      # needs no network access and produces the same output every time.
      # `bun run datasets` refreshes them; see refresh-datasets.yml.
      - name: Build
        run: bun run build

      - name: Verify build output
        run: bun run verify

      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'

      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
