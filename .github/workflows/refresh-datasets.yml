name: Refresh consumer datasets

# The free/disposable mailbox lists are committed under ./data/ so that builds
# are reproducible and need no network access. This keeps them current without
# giving upstream a way to change production unreviewed: it opens a PR, so an
# upstream edit arrives as a diff someone approves.
on:
  schedule:
    # Mondays 05:00 UTC, ahead of the Dependabot run at 06:00 Europe/London.
    - cron: '0 5 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Refresh datasets from upstream
        run: bun run datasets

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- data/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Datasets already current."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- data/
          fi

      # Guard against a mangled upstream response landing in a PR: the build
      # and its checks must still pass over the refreshed lists.
      - name: Verify the refreshed data still builds
        if: steps.diff.outputs.changed == 'true'
        run: |
          bun test
          bun run build
          bun run verify

      # `gh` rather than a third-party PR action — it ships with the runner and
      # is maintained by GitHub.
      - name: Open a pull request
        if: steps.diff.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          BRANCH="chore/refresh-datasets"

          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          FREE=$(wc -l < data/free-domains.txt)
          DISP=$(wc -l < data/disposable-domains.txt)

          git switch -c "$BRANCH"
          git add data/
          git commit -m "chore(data): refresh consumer-domain datasets

          ${FREE} free and ${DISP} disposable domains, from the upstream
          lists named in src/datasets.ts. Generated by \`bun run datasets\`.
          "
          git push -f origin "$BRANCH"

          if gh pr view "$BRANCH" --json state -q .state 2>/dev/null | grep -qx OPEN; then
            echo "Existing PR updated."
          else
            gh pr create \
              --title "chore(data): refresh consumer-domain datasets" \
              --body "Automated weekly refresh of the committed free/disposable mailbox lists.

          Now **${FREE}** free and **${DISP}** disposable domains. Sources are declared in \`src/datasets.ts\`.

          \`bun test\`, \`bun run build\` and \`bun run verify\` all passed against the refreshed lists before this PR was opened. Review the diff to see what upstream changed." \
              --base master \
              --head "$BRANCH"
          fi
